# R CMD check across the platforms GDAL7 claims to support.
#
# The package compiles against a fast-moving C++ library, so the point of this
# workflow is to catch a GDAL API drift or a platform-specific build problem at
# the commit that introduces it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install GDAL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev

      - name: Install GDAL (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal

      - name: Install GDAL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $home_var = Get-ChildItem Env: |
            Where-Object { $_.Name -match '^RTOOLS\d+_HOME$' } |
            Select-Object -First 1
          if (-not $home_var) { throw "No RTOOLS*_HOME in the environment" }
          $rtools = $home_var.Value
          Write-Host "Using Rtools at $rtools"
          & "$rtools\usr\bin\pacman.exe" -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gdal
          if ($LASTEXITCODE -ne 0) { throw "pacman failed" }
          echo "$rtools\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Report the GDAL that was found
        shell: bash
        run: gdal-config --version || pkg-config --modversion gdal

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
