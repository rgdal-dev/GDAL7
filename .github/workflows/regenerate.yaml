# Prove that the checked-in generated code is what the generator produces.
#
# GDAL7's claim is that it tracks GDAL by regeneration rather than by hand. A
# hand edit to a generated file breaks that claim quietly, and the next
# regeneration silently reverts it. This job regenerates from the vendored API
# model and fails if anything moved, so the claim is checked on every commit
# instead of being taken on trust.
#
# The model is vendored at inst/api/gdal-api.json, so no GDAL checkout is
# needed here. Refreshing it against a newer GDAL is a human step:
#   Rscript data-raw/orchestrate.R --refresh

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: regenerate

permissions: read-all

jobs:
  regenerate:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::cpp11, any::decor, any::jsonlite

      - name: Regenerate
        run: Rscript data-raw/orchestrate.R

      - name: Check that nothing moved
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "The generated files above differ from what the generator produces."
            echo "Change data-raw/ rather than the generated file, then run:"
            echo "  Rscript data-raw/orchestrate.R"
            exit 1
          fi
